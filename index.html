<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>The Daily Brief</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--line:#e4dfd6;--accent:#8a1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--text:#ececec;--muted:#9a9a9a;--line:#2e2e2e;--accent:#e06c6c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Georgia,"Times New Roman",serif}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 0;text-align:center;border-bottom:3px double var(--line)}
h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:.5px}
.date{color:var(--muted);font:13px system-ui,sans-serif;margin:4px 0 10px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;
  display:flex;gap:4px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:600 14px system-ui,sans-serif;background:none;border:0;color:var(--muted);
  padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:#fff}
.tools{max-width:1100px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{font:15px system-ui,sans-serif;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--text)}
.tools input{flex:1;min-width:180px}
.tools button{font:14px system-ui,sans-serif;padding:9px 14px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.brief{background:var(--card);border-left:4px solid var(--accent);padding:12px 16px;margin:10px 0 16px;
  border-radius:4px;white-space:pre-line;font-size:15px}
.brief b{font:700 12px system-ui,sans-serif;letter-spacing:1px;color:var(--accent);display:block;margin-bottom:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card img{width:100%;height:160px;object-fit:cover;background:var(--line)}
.card div{padding:12px 14px 14px}
.card h2{font-size:18px;line-height:1.25;margin:0 0 6px}
.card p{margin:0 0 8px;color:var(--muted);font-size:14px}
.meta{font:12px system-ui,sans-serif;color:var(--muted)}
.meta b{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <h1>The Daily Brief</h1>
  <div class="date" id="date"></div>
</header>
<nav id="tabs"></nav>
<div class="tools">
  <input id="q" type="search" placeholder="Search headlines…">
  <select id="src"><option value="">All outlets</option></select>
  <button id="refresh">Refresh</button>
</div>
<main>
  <div id="brief"></div>
  <div class="grid" id="list"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let DATA = null, current = "top";

function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}
function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function allItems(){
  return Object.values(DATA.sections).flatMap(s => s.items)
    .sort((a, b) => b.time.localeCompare(a.time));
}
function currentItems(){
  return current === "top" ? allItems() : DATA.sections[current].items;
}

function buildTabs(){
  const tabs = [["top", "Top"], ...Object.entries(DATA.sections).map(([k, v]) => [k, v.label])];
  $("tabs").innerHTML = tabs.map(([k, l]) =>
    `<button data-k="${k}" class="${k === current ? "on" : ""}">${l}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    current = b.dataset.k; $("src").value = ""; buildTabs(); buildSources(); render();
  });
}
function buildSources(){
  const names = [...new Set(currentItems().map(i => i.source))].sort();
  $("src").innerHTML = `<option value="">All outlets</option>` +
    names.map(n => `<option>${esc(n)}</option>`).join("");
}

function render(){
  const q = $("q").value.trim().toLowerCase(), src = $("src").value;
  const items = currentItems().filter(i =>
    (!src || i.source === src) &&
    (!q || (i.title + " " + i.summary).toLowerCase().includes(q)));
  const brief = current !== "top" && DATA.sections[current].briefing;
  $("brief").innerHTML = brief && !q && !src
    ? `<div class="brief"><b>AI BRIEFING</b>${esc(brief)}</div>` : "";
  $("list").innerHTML = items.length ? items.map(i => `
    <a class="card" href="${esc(i.link)}" target="_blank" rel="noopener">
      ${i.image ? `<img loading="lazy" src="${esc(i.image)}" alt="" onerror="this.remove()">` : ""}
      <div>
        <h2>${esc(i.title)}</h2>
        ${i.summary ? `<p>${esc(i.summary)}</p>` : ""}
        <span class="meta"><b>${esc(i.source)}</b>${i.also && i.also.length ? " + " + i.also.length + " more" : ""} · ${ago(i.time)}</span>
      </div>
    </a>`).join("") : `<div class="empty">No stories found.</div>`;
}

async function load(){
  try {
    const r = await fetch("news.json?t=" + Date.now());
    DATA = await r.json();
  } catch (e) {
    $("list").innerHTML = `<div class="empty">Couldn't load news.json. Run fetch_news.py first.</div>`;
    return;
  }
  $("date").textContent = new Date().toLocaleDateString(undefined,
    {weekday: "long", year: "numeric", month: "long", day: "numeric"}) +
    " · updated " + ago(DATA.updated);
  buildTabs(); buildSources(); render();
}

$("q").oninput = render;
$("src").onchange = render;
$("refresh").onclick = load;
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
