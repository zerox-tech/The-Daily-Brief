name: Update news

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
      - name: Commit updated news.json
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Update news" && git push)
